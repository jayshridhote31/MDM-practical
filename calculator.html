<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Jayshri Dhote| CM25083</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-hidden">

  <!-- Ambient Glow Background -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-fuchsia-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Calculator Shell -->
  <div class="w-full max-w-xl bg-slate-900/90 backdrop-blur-2xl border border-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl shadow-cyan-950/30 relative z-10">
    
    <!-- Header Bar & Controls -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-xs font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 uppercase">
          ProFX-9000 • Scientific
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <!-- Angle Mode Toggle -->
        <button id="angleBtn" onclick="toggleAngleMode()" class="px-2.5 py-1 rounded-lg bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-bold hover:bg-cyan-500/20 transition-all">
          DEG
        </button>
        <!-- History Drawer Toggle -->
        <button onclick="toggleHistoryDrawer()" class="px-2.5 py-1 rounded-lg bg-fuchsia-500/10 border border-fuchsia-500/30 text-fuchsia-300 text-xs font-bold hover:bg-fuchsia-500/20 transition-all flex items-center gap-1">
          <span>📜</span> History
        </button>
      </div>
    </div>

    <!-- Dual Screen Display -->
    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 mb-5 text-right relative overflow-hidden">
      <!-- Status Badges -->
      <div class="flex justify-between items-center text-[10px] font-mono-num text-slate-500 mb-1">
        <div class="flex gap-2">
          <span id="memBadge" class="hidden text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">M</span>
          <span id="angleBadge" class="text-cyan-400 bg-cyan-500/10 px-1.5 py-0.5 rounded border border-cyan-500/20">DEG</span>
        </div>
        <div id="formula" class="text-slate-400 font-mono-num text-sm truncate max-w-[280px] sm:max-w-[380px]"></div>
      </div>

      <!-- Main Number Output -->
      <div id="display" class="text-3xl sm:text-4xl font-black text-white font-mono-num tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none py-1">
        0
      </div>
    </div>

    <!-- Memory Function Bar -->
    <div class="grid grid-cols-4 gap-2 mb-3">
      <button onclick="memoryOp('MC')" class="py-1.5 rounded-xl bg-slate-800/80 text-emerald-400 font-bold text-xs hover:bg-emerald-500/20 transition-all">MC</button>
      <button onclick="memoryOp('MR')" class="py-1.5 rounded-xl bg-slate-800/80 text-emerald-400 font-bold text-xs hover:bg-emerald-500/20 transition-all">MR</button>
      <button onclick="memoryOp('M+')" class="py-1.5 rounded-xl bg-slate-800/80 text-emerald-400 font-bold text-xs hover:bg-emerald-500/20 transition-all">M+</button>
      <button onclick="memoryOp('M-')" class="py-1.5 rounded-xl bg-slate-800/80 text-emerald-400 font-bold text-xs hover:bg-emerald-500/20 transition-all">M-</button>
    </div>

    <!-- Main Scientific Keypad -->
    <div class="grid grid-cols-5 gap-2 text-sm sm:text-base">
      
      <!-- Scientific Functions (Row 1) -->
      <button onclick="applyFunc('sin')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">sin</button>
      <button onclick="applyFunc('cos')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">cos</button>
      <button onclick="applyFunc('tan')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">tan</button>
      <button onclick="clearAll()" class="py-2.5 rounded-xl bg-rose-500/20 text-rose-300 font-bold border border-rose-500/30 hover:bg-rose-500/30 active:scale-95 transition-all">AC</button>
      <button onclick="deleteLast()" class="py-2.5 rounded-xl bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30 hover:bg-amber-500/30 active:scale-95 transition-all">⌫</button>

      <!-- Scientific Functions (Row 2) -->
      <button onclick="applyFunc('asin')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">sin⁻¹</button>
      <button onclick="applyFunc('acos')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">cos⁻¹</button>
      <button onclick="applyFunc('atan')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">tan⁻¹</button>
      <button onclick="appendChar('(')" class="py-2.5 rounded-xl bg-slate-800/90 text-slate-300 font-bold hover:bg-slate-700 active:scale-95 transition-all">(</button>
      <button onclick="appendChar(')')" class="py-2.5 rounded-xl bg-slate-800/90 text-slate-300 font-bold hover:bg-slate-700 active:scale-95 transition-all">)</button>

      <!-- Row 3 -->
      <button onclick="applyFunc('log')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">log</button>
      <button onclick="appendNumber('7')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">7</button>
      <button onclick="appendNumber('8')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">8</button>
      <button onclick="appendNumber('9')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">9</button>
      <button onclick="appendOperator('÷')" class="py-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 font-bold hover:bg-fuchsia-500/30 active:scale-95 transition-all">÷</button>

      <!-- Row 4 -->
      <button onclick="applyFunc('ln')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">ln</button>
      <button onclick="appendNumber('4')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">4</button>
      <button onclick="appendNumber('5')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">5</button>
      <button onclick="appendNumber('6')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">6</button>
      <button onclick="appendOperator('×')" class="py-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 font-bold hover:bg-fuchsia-500/30 active:scale-95 transition-all">×</button>

      <!-- Row 5 -->
      <button onclick="applyFunc('sqrt')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">√</button>
      <button onclick="appendNumber('1')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">1</button>
      <button onclick="appendNumber('2')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">2</button>
      <button onclick="appendNumber('3')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">3</button>
      <button onclick="appendOperator('-')" class="py-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 font-bold hover:bg-fuchsia-500/30 active:scale-95 transition-all">−</button>

      <!-- Row 6 -->
      <button onclick="appendChar('^')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">xʸ</button>
      <button onclick="appendNumber('0')" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">0</button>
      <button onclick="appendDecimal()" class="py-2.5 rounded-xl bg-slate-800/40 text-slate-100 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">.</button>
      <button onclick="applyConstant('π')" class="py-2.5 rounded-xl bg-slate-800/60 text-amber-300 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">π</button>
      <button onclick="appendOperator('+')" class="py-2.5 rounded-xl bg-fuchsia-500/20 text-fuchsia-300 font-bold hover:bg-fuchsia-500/30 active:scale-95 transition-all">+</button>

      <!-- Row 7 -->
      <button onclick="applyFunc('fact')" class="py-2.5 rounded-xl bg-slate-800/60 text-cyan-300 font-semibold hover:bg-cyan-500/20 active:scale-95 transition-all">n!</button>
      <button onclick="applyConstant('e')" class="py-2.5 rounded-xl bg-slate-800/60 text-amber-300 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">e</button>
      <button onclick="useAns()" class="py-2.5 rounded-xl bg-slate-800/60 text-emerald-300 font-bold hover:bg-slate-700/60 active:scale-95 transition-all">Ans</button>
      <button onclick="calculate()" class="col-span-2 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 via-fuchsia-500 to-rose-500 text-white font-black shadow-lg shadow-fuchsia-500/25 hover:shadow-fuchsia-500/40 active:scale-95 transition-all">
        =
      </button>

    </div>

    <!-- Collapsible History Drawer Overlay -->
    <div id="historyDrawer" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-3xl rounded-3xl p-6 flex flex-col z-20 transition-all border border-slate-700">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-extrabold text-lg text-white flex items-center gap-2">
          <span>📜</span> Calculation History
        </h3>
        <button onclick="toggleHistoryDrawer()" class="p-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white">✕</button>
      </div>

      <div id="historyList" class="flex-grow overflow-y-auto space-y-2 pr-1 font-mono-num text-sm">
        <p class="text-slate-500 text-center py-8">No history yet.</p>
      </div>

      <button onclick="clearHistoryLog()" class="mt-4 w-full py-2 bg-rose-500/10 border border-rose-500/30 text-rose-300 font-bold rounded-xl hover:bg-rose-500/20 text-xs transition-all">
        Clear History Log
      </button>
    </div>

  </div>

  <!-- Calculator Script -->
  <script>
    let currentExpr = '';
    let lastResult = '';
    let memoryVal = 0;
    let isDegMode = true;
    let historyLog = [];

    const displayEl = document.getElementById('display');
    const formulaEl = document.getElementById('formula');
    const angleBtn = document.getElementById('angleBtn');
    const angleBadge = document.getElementById('angleBadge');
    const memBadge = document.getElementById('memBadge');
    const historyList = document.getElementById('historyList');

    function updateDisplay() {
      displayEl.innerText = currentExpr || '0';
      formulaEl.innerText = currentExpr;
    }

    function appendNumber(num) {
      currentExpr += num;
      updateDisplay();
    }

    function appendOperator(op) {
      if (!currentExpr && op !== '-') return;
      currentExpr += ` ${op} `;
      updateDisplay();
    }

    function appendChar(char) {
      currentExpr += char;
      updateDisplay();
    }

    function appendDecimal() {
      if (!currentExpr.endsWith('.')) {
        currentExpr += '.';
        updateDisplay();
      }
    }

    function applyConstant(constType) {
      if (constType === 'π') currentExpr += Math.PI.toFixed(6);
      if (constType === 'e') currentExpr += Math.E.toFixed(6);
      updateDisplay();
    }

    function useAns() {
      if (lastResult) {
        currentExpr += lastResult;
        updateDisplay();
      }
    }

    function toggleAngleMode() {
      isDegMode = !isDegMode;
      angleBtn.innerText = isDegMode ? 'DEG' : 'RAD';
      angleBadge.innerText = isDegMode ? 'DEG' : 'RAD';
    }

    function applyFunc(fn) {
      currentExpr += `${fn}(`;
      updateDisplay();
    }

    function clearAll() {
      currentExpr = '';
      updateDisplay();
    }

    function deleteLast() {
      currentExpr = currentExpr.trimEnd().slice(0, -1);
      updateDisplay();
    }

    // Advanced Evaluation Logic
    function calculate() {
      if (!currentExpr) return;

      let exprToEval = currentExpr
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\^/g, '**');

      // Helper Trig Functions with Angle Conversion
      const toRad = (x) => isDegMode ? (x * Math.PI) / 180 : x;
      const toDeg = (x) => isDegMode ? (x * 180) / Math.PI : x;

      const sin = (x) => Math.sin(toRad(x));
      const cos = (x) => Math.cos(toRad(x));
      const tan = (x) => Math.tan(toRad(x));
      const asin = (x) => toDeg(Math.asin(x));
      const acos = (x) => toDeg(Math.acos(x));
      const atan = (x) => toDeg(Math.atan(x));
      const log = (x) => Math.log10(x);
      const ln = (x) => Math.log(x);
      const sqrt = (x) => Math.sqrt(x);
      const fact = (n) => {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
      };

      try {
        const evalFunc = new Function('sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'log', 'ln', 'sqrt', 'fact', `return ${exprToEval}`);
        let result = evalFunc(sin, cos, tan, asin, acos, atan, log, ln, sqrt, fact);

        if (typeof result === 'number' && !isNaN(result)) {
          // Format decimals neatly
          result = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
          
          historyLog.unshift({ expr: currentExpr, result: result });
          renderHistory();

          lastResult = String(result);
          currentExpr = String(result);
          updateDisplay();
        } else {
          displayEl.innerText = 'Error';
        }
      } catch (err) {
        displayEl.innerText = 'Syntax Error';
      }
    }

    // Memory operations
    function memoryOp(op) {
      const val = parseFloat(displayEl.innerText) || 0;
      if (op === 'MC') {
        memoryVal = 0;
        memBadge.classList.add('hidden');
      } else if (op === 'MR') {
        currentExpr += String(memoryVal);
        updateDisplay();
      } else if (op === 'M+') {
        memoryVal += val;
        memBadge.classList.remove('hidden');
      } else if (op === 'M-') {
        memoryVal -= val;
        memBadge.classList.remove('hidden');
      }
    }

    // History Drawer handlers
    function toggleHistoryDrawer() {
      document.getElementById('historyDrawer').classList.toggle('hidden');
    }

    function renderHistory() {
      if (historyLog.length === 0) {
        historyList.innerHTML = `<p class="text-slate-500 text-center py-8">No history yet.</p>`;
        return;
      }

      historyList.innerHTML = historyLog.map((item, idx) => `
        <div onclick="restoreHistory(${idx})" class="p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl cursor-pointer transition-all border border-slate-700/40">
          <div class="text-xs text-slate-400">${item.expr}</div>
          <div class="text-base font-bold text-cyan-400 font-mono-num">= ${item.result}</div>
        </div>
      `).join('');
    }

    function restoreHistory(idx) {
      currentExpr = String(historyLog[idx].result);
      updateDisplay();
      toggleHistoryDrawer();
    }

    function clearHistoryLog() {
      historyLog = [];
      renderHistory();
    }
  </script>

</body>
</html>
